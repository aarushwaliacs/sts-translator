const MICMSG='Voice input is blocked because this page is embedded in claude.ai, which doesn’t allow microphone access. Workaround: click the text box and use your device’s own dictation (the microphone key on a phone keyboard, Win+H on Windows, or press Fn twice on a Mac), then press Translate. If you opened this page on its own and still see this message, allow the microphone in your browser’s address-bar site settings.';function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast("Speech recognition isn’t supported here.");const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature&&!pp.allowsFeature('microphone')){S.err=MICMSG;S.tab='voice';render();const i=document.getElementById('inp');i&&i.focus();return}if(S.rec&&rec){rec.stop();return}rec=new SR();rec.lang=S.auto?"":lg(S.src)[4];rec.interimResults=true;rec.continuous=false;const base=S.text;rec.onstart=()=>{S.rec=true;S.err="";render()};rec.onresult=e=>{S.text=(base+" "+[...e.results].map(r=>r[0].transcript).join("")).trim();const i=document.getElementById("inp");if(i)i.value=S.text};rec.onerror=e=>{S.rec=false;S.err=e.error=="not-allowed"||e.error=="service-not-allowed"?MICMSG:e.error=="no-speech"?"No speech was detected.":"Speech recognition failed ("+e.error+").";render()};rec.onend=()=>{S.rec=false;render();if(S.text.trim()&&!S.err&&S.tab=="voice")doTr()};try{rec.start()}catch(e){S.err="Couldn’t start the microphone."}render()}
function numsIn(t){const out=[];const re=[[/\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/g,"Date"],[/\b\d{1,2}:\d{2}(?:\s?[ap]m)?\b/gi,"Time"],[/[$€£¥₹]\s?\d[\d,.]*/g,"Currency"],[/\b\d[\d,.]*\b/g,"Number"]];const seen=new Set();re.forEach(([r,k])=>{(t.match(r)||[]).forEach(v=>{if(!seen.has(v)&&![...seen].some(s=>s.includes(v))){seen.add(v);out.push({k,v})}})});return out}
